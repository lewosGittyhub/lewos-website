<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F3B35">
  <title>Page not found | Lewos</title>
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>
    :root { --green:#0F3B35; --orange:#E5643A; --cream:#F7F3EC; --beige:#EDE6DA; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; font-family:"Inter",sans-serif; color:var(--cream); background:var(--green); line-height:1.6; }
    main { width:min(calc(100% - 48px),900px); padding:80px 0; }
    .eyebrow { margin:0 0 18px; color:var(--orange); font:600 .78rem/1.2 "Poppins",sans-serif; letter-spacing:.18em; text-transform:uppercase; }
    h1 { max-width:800px; margin:0 0 24px; font:700 clamp(3.5rem,9vw,7rem)/1 "Poppins",sans-serif; letter-spacing:-.05em; }
    p { max-width:620px; margin:0 0 34px; color:var(--beige); font-size:clamp(1.05rem,2vw,1.3rem); }
    .links { display:flex; flex-wrap:wrap; gap:14px; }
    a { display:inline-flex; min-height:54px; padding:14px 24px; align-items:center; border:2px solid var(--orange); border-radius:6px; color:var(--cream); background:var(--orange); font:600 .94rem/1.2 "Poppins",sans-serif; text-decoration:none; }
    a + a { border-color:rgba(247,243,236,.5); background:transparent; }
    a:focus-visible { outline:3px solid #f4a285; outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">The path ends here</p>
    <h1>This page has wandered off.</h1>
    <p>The way back is close. Return to Lewos, or step through the doors of The Lewos Tavern.</p>
    <div class="links">
      <a href="/">Return home →</a>
      <a href="/tavern/">Enter the Tavern →</a>
    </div>
  </main>
</body>
</html>
