<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Question received | The Lewos Tavern</title>
  <meta name="theme-color" content="#0F3B35">
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>
    :root { --green:#0F3B35; --orange:#E5643A; --cream:#F7F3EC; --beige:#EDE6DA; }
    * { box-sizing:border-box; }
    a:focus-visible, button:focus-visible { outline:3px solid #f4a285; outline-offset:4px; }
    body { min-height:100vh; margin:0; display:grid; grid-template-rows:auto 1fr auto; font-family:"Inter",sans-serif; color:var(--cream); background:var(--green); line-height:1.65; }
    .wrap { width:min(calc(100% - 48px),1180px); margin-inline:auto; }
    header { padding:26px 0; }
    .logo { color:inherit; font:700 1.9rem/1 "Poppins",sans-serif; letter-spacing:-.04em; text-decoration:none; }
    main { display:grid; align-items:center; padding:80px 0 120px; }
    .eyebrow { margin:0 0 18px; color:var(--orange); font:600 .78rem/1.2 "Poppins",sans-serif; letter-spacing:.18em; text-transform:uppercase; }
    h1 { max-width:900px; margin:0 0 28px; font:700 clamp(3.5rem,8vw,7rem)/1.02 "Poppins",sans-serif; letter-spacing:-.05em; }
    .lead { max-width:680px; margin:0 0 38px; color:var(--beige); font-size:clamp(1.08rem,1.8vw,1.35rem); }
    .button { display:inline-flex; min-height:54px; padding:14px 24px; align-items:center; border:2px solid var(--orange); border-radius:4px; background:var(--orange); color:inherit; font:600 .94rem/1.2 "Poppins",sans-serif; text-decoration:none; }
    footer { padding:26px 0; border-top:1px solid rgba(247,243,236,.15); color:rgba(237,230,218,.7); font-size:.85rem; }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="logo" href="/">Lewos</a></div></header>
  <main><div class="wrap">
    <p class="eyebrow">The Lewos Tavern</p>
    <h1>Your question has found us.</h1>
    <p class="lead">Thank you. Robert will read your message and reply by email as soon as he can.</p>
    <a class="button" href="/tavern/">Back to The Tavern →</a>
  </div></main>
  <footer><div class="wrap">© 2026 Lewos · <a href="../privacy/">Privacy</a> · <a href="../legal/">Legal</a></div></footer>
</body>
</html>
