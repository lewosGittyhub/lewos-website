<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>You're on the list | The Lewos Tavern</title>
  <meta name="theme-color" content="#0F3B35">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root { --green: #0F3B35; --orange: #E5643A; --cream: #F7F3EC; --beige: #EDE6DA; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; grid-template-rows: auto 1fr auto; font-family: "Inter", sans-serif; color: var(--cream); background: var(--green); line-height: 1.65; }
    a { color: inherit; }
    .wrap { width: min(calc(100% - 48px), 1180px); margin-inline: auto; }
    header { padding: 26px 0; }
    .logo { font: 700 1.9rem/1 "Poppins", sans-serif; letter-spacing: -.04em; text-decoration: none; }
    main { display: grid; align-items: center; padding: 80px 0 120px; }
    .eyebrow { margin: 0 0 18px; color: var(--orange); font: 600 .78rem/1.2 "Poppins", sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 900px; margin: 0 0 28px; font: 700 clamp(3.5rem, 8vw, 7rem)/1.02 "Poppins", sans-serif; letter-spacing: -.05em; }
    .lead { max-width: 680px; margin: 0 0 38px; color: var(--beige); font-size: clamp(1.08rem, 1.8vw, 1.35rem); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; }
    .button { display: inline-flex; min-height: 54px; padding: 14px 24px; align-items: center; border: 2px solid var(--orange); border-radius: 4px; background: var(--orange); font: 600 .94rem/1.2 "Poppins", sans-serif; text-decoration: none; }
    .button--ghost { background: transparent; border-color: rgba(247,243,236,.5); }
    footer { padding: 26px 0; border-top: 1px solid rgba(247,243,236,.15); color: rgba(237,230,218,.7); font-size: .85rem; }
  </style>
</head>
<body>
  <header><div class="wrap"><a class="logo" href="/">Lewos</a></div></header>
  <main><div class="wrap">
    <p class="eyebrow">The Lewos Tavern · First access</p>
    <h1>You're on the list.</h1>
    <p class="lead">When The Lewos Tavern opens for booking, you'll be among the first to hear — and the first-access price is yours.<br><br>Until then, the story continues on Instagram.</p>
    <div class="links"><a class="button" href="/tavern/">Back to The Tavern →</a><a class="button button--ghost" href="https://instagram.com/lewos.co">Follow on Instagram</a></div>
  </div></main>
  <footer><div class="wrap">© 2026 Lewos</div></footer>
</body>
</html>
